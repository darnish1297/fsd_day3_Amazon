<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="80" height="120" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <!-- Mouse Body -->
  <rect x="15" y="10" width="70" height="125" rx="35" fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Button Split Line -->
  <line x1="50" y1="12" x2="50" y2="52" stroke="#1f1f1f" stroke-width="2"/>
  <path d="M 16 52 C 30 54, 70 54, 84 52" stroke="#1f1f1f" stroke-width="2"/>
  <!-- Scroll Wheel -->
  <rect x="45" y="24" width="10" height="22" rx="5" fill="url(#wheelGrad)" stroke="#555555" stroke-width="1.2"/>
  <!-- Subtle lighting accents -->
  <path d="M 28 32 C 24 60, 24 95, 30 115" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
</svg>
